[package]
name = "writing-tools"
version = "7.0.0"
edition = "2024"
description = "AI writing assistant for Wayland"
license = "GPL-3.0-only"
repository = "https://github.com/higajooj/WritingToolsLinux"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
async-channel = "2.5.0"
async-trait = "0.1.92"
base64 = "0.23.1"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
indexmap = { version = "2.14.2", features = ["serde"] }
ksni = "0.3.6"
log = "0.4.34"
open = "5.4.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
url = "2.5.8"
